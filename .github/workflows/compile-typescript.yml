name: Compile Typescript

on:
  push:
  pull_request:

jobs:
  compile-typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/Krypton'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --save-dev

      - name: Check eslint
        run: npm run eslint

      - name: Compile Typescript
        run: npm run build

      - name: Run Jest
        run: npm run test
